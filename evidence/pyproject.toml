[project]
name = "evidence"
version = "0.1.0"
description = "Soul Map evidence pipeline: import a person's own turns, score them locally with Ollama, emit structured evidence only"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.70"]

[project.scripts]
evidence = "evidence.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidence"]
